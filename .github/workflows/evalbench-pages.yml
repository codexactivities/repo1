name: Deploy EvalBench to Pages
on:
  push:
    branches: [main]
    paths: ['evalbench/**', '.github/workflows/evalbench-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evalbench-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
        working-directory: evalbench
      - uses: actions/upload-pages-artifact@v3
        with:
          path: evalbench/launcher
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
